<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Remote shell</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    #term { height: 100%; }
  </style>
</head>
<body>
<div id="term"></div>
<script>
  // Use only over a trusted network (LAN with care, or Tailscale).
  // Plain ws:// is unencrypted. Prefer a wss:// endpoint for anything beyond that.
  const url = prompt("WebSocket URL", "ws://192.168.1.50:8080/shell");
  const token = prompt("Access token");

  const term = new Terminal({ cursorBlink: true, fontFamily: "monospace", convertEol: true });
  term.open(document.getElementById("term"));

  const ws = new WebSocket(url);
  ws.binaryType = "arraybuffer";

  ws.onopen = () => {
    // The server requires auth as the first frame
    ws.send(JSON.stringify({ type: "auth", token }));
    ws.send(JSON.stringify({ type: "resize", rows: term.rows, cols: term.cols }));
  };

  ws.onmessage = (e) => {
    term.write(typeof e.data === "string" ? e.data : new Uint8Array(e.data));
  };

  ws.onclose = () => term.write("\r\n[disconnected]\r\n");

  term.onData((data) => {
    if (ws.readyState === WebSocket.OPEN) {
      ws.send(new TextEncoder().encode(data));
    }
  });
</script>
</body>
</html>
