[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "malora"
version = "2.1.0"
description = "Turn shellcode into verified Linux ELF executables and Android APK containers."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development :: Assemblers",
    "Topic :: Security",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
malora = "malora.cli:main"

[tool.setuptools]
package-dir = {malora = ".", repl = "repl", vendor = "vendor"}
packages = ["malora", "repl", "vendor"]

[tool.setuptools.package-data]
malora = ["py.typed", "vendor/android-sdk/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py39"
